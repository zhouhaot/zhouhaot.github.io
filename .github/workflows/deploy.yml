# 服务器部署工作流
# ============================================
# 前置条件（一次性配置）：
# 1. 在仓库 Settings → Secrets → Actions 中添加：
#    - SSH_HOST   服务器 IP 或域名
#    - SSH_USER   SSH 用户名
#    - SSH_PORT   SSH 端口（默认 22 时可省略）
#    - SSH_KEY    SSH 私钥（ed25519，公钥需加入服务器 authorized_keys）
# 2. 服务器上创建站点目录（默认 /var/www/blog）并授权 SSH_USER 写入
# 3. Nginx/Caddy 将域名指向该目录
# 4. 在仓库 Settings → Secrets and variables → Actions → Variables 中
#    添加变量 DEPLOY_SERVER = true 启用本工作流（未配置 secrets 前不要开启）
# ============================================

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-server
  cancel-in-progress: true

jobs:
  deploy:
    # 通过仓库变量开关：配置好 SSH secrets 并验证服务器后设为 true
    if: vars.DEPLOY_SERVER == 'true'
    runs-on: ubuntu-latest
    env:
      SITE_DIR: /www/wwwroot/zevth.work
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # ar/ 是独立的 WebAR 静态应用，不经过 Astro 管线，直接并入发布产物
      - name: Bundle WebAR app
        run: cp -r ar dist/ar

      - name: Upload to server
        uses: burnett01/rsync-deployments@7.0.2
        with:
          switches: -avzr --delete --exclude=.well-known/
          path: dist/
          remote_path: ${{ env.SITE_DIR }}/
          remote_host: ${{ secrets.SSH_HOST }}
          remote_port: ${{ secrets.SSH_PORT || 22 }}
          remote_user: ${{ secrets.SSH_USER }}
          remote_key: ${{ secrets.SSH_KEY }}

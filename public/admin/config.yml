# zevth 内容管理后台配置（Sveltia CMS，兼容 Decap 格式）
# 后台地址: https://zevth.work/admin/
#
# 登录方式（二选一）：
#   A. 令牌登录（推荐，零配置）：登录页选 Sign In with Token，粘贴 GitHub 个人访问令牌。
#      令牌需 repo 权限；创建入口见 docs/WRITING.md「后台管理」章节。
#   B. OAuth 一键登录（可选）：需要 GitHub OAuth App + 认证服务，
#      部署后取消下面 base_url 注释。见 docs/WRITING.md。

backend:
  name: github
  repo: zhouhaot/zhouhaot.github.io
  branch: main
  # base_url: https://<your-auth-service>/oauth

site_url: https://zevth.work
locale: zh_CN

media_folder: public/uploads
public_path: /uploads

collections:
  - name: posts
    label: 文章
    label_singular: 文章
    folder: src/content/posts
    create: true
    slug: "{{slug}}"
    extension: md
    summary: "{{title}} {{draft}}"
    sortable_fields: [published, title, draft]
    fields:
      - { name: title, label: 标题, widget: string }
      - {
          name: published,
          label: 发布日期,
          widget: datetime,
          date_format: "YYYY-MM-DD",
          time_format: false,
          format: "YYYY-MM-DD",
        }
      - { name: description, label: 摘要, widget: text, required: false }
      - { name: image, label: 封面图, widget: image, required: false, default: "" }
      - { name: tags, label: 标签, widget: list, required: false, default: [] }
      - { name: category, label: 分类, widget: string, required: false, default: "" }
      - { name: draft, label: 草稿, widget: boolean, default: true }
      - { name: lang, label: 语言, widget: string, required: false, default: "" }

  - name: projects
    label: 作品
    label_singular: 作品
    folder: src/content/projects
    create: true
    slug: "{{slug}}"
    extension: md
    summary: "{{title}} {{year}}"
    sortable_fields: [order, title, year]
    fields:
      - { name: title, label: 标题, widget: string }
      - { name: description, label: 简介, widget: text, required: false, default: "" }
      - { name: tags, label: 标签, widget: list, required: false, default: [] }
      - { name: tech, label: 技术栈, widget: list, required: false, default: [] }
      - { name: link, label: 源码链接, widget: string, required: false, default: "" }
      - { name: demo, label: 演示链接, widget: string, required: false, default: "" }
      - { name: year, label: 年份, widget: string, required: false, default: "" }
      - { name: status, label: 状态, widget: string, required: false, default: "" }
      - { name: order, label: 排序(越小越靠前), widget: number, required: false, default: 0 }
